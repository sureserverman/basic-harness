name: Release plugins

# Build per-plugin zips and attach them to a GitHub release
# whenever a tag matching v* is pushed (v0.3.0, v1.0.0, etc.).
#
# Each plugin under plugins/* becomes one zip named <plugin>-<version>.zip
# (e.g., welcome-v0.3.0.zip). Users download the zips they want and upload
# them via Cowork's Customize → Browse plugins → upload custom plugin file UI.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so release notes can reference past tags

      - name: Resolve version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building release for ${GITHUB_REF_NAME}"

      - name: Build per-plugin zips
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for plugin_dir in plugins/*/; do
            name=$(basename "$plugin_dir")
            zip_name="${name}-${{ steps.version.outputs.version }}.zip"
            zip_path="$GITHUB_WORKSPACE/dist/${zip_name}"
            echo "Packaging ${name} -> ${zip_name}"
            (
              cd "$plugin_dir"
              zip -r "$zip_path" . \
                -x "*.DS_Store" "*.swp" "*.swo" "__pycache__/*" "*.pyc" ".git/*" "node_modules/*"
            )
          done
          echo
          echo "Built artifacts:"
          ls -la dist/

      - name: Verify at least one zip was built
        run: |
          set -euo pipefail
          count=$(ls dist/*.zip 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No plugin zips were built. Check that plugins/*/ contains at least one plugin." >&2
            exit 1
          fi
          echo "Verified ${count} plugin zip(s) built."

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Cowork install:**

            1. Download the zip(s) for the plugins you want from the assets below.
            2. In Cowork, click **Customize** in the sidebar → **Browse plugins** → **upload custom plugin file** → select the zip.
            3. Repeat for each plugin.
            4. Restart Cowork (`Cmd+Q` and reopen) so the skills register.
            5. Ask "show me what you do" or type `/welcome:tour` to start.

            See the [README](https://github.com/${{ github.repository }}#install) for the full install flow and the four-persona orientation.
